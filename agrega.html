<!DOCTYPE html>
<html lang="es">

<head>

 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Agregar Usuario</title>

 <script type="module" src="libclienteweb/manejaErrores.js"></script>

 <style>
   :root {
     --bg-color: #8d7fb8c9;
     --card-bg: #ffffff;
     --text-color: #332a42;
     --text-light: #7a6e8a;
     --hover-pink: #ffd1dc;
   }

   body {
     font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
     background-color: var(--bg-color);
     color: var(--text-color);
     margin: 0;
     padding: 20px;
     display: flex;
     flex-direction: column;
     align-items: center;
     min-height: 100vh;
     box-sizing: border-box;
   }

   #formulario {
     background-color: var(--card-bg);
     padding: 30px;
     border-radius: 12px;
     box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
     width: 100%;
     max-width: 500px;
     box-sizing: border-box;
   }

   h1 {
     color: var(--text-color);
     font-size: 1.8rem;
     margin-top: 0;
     margin-bottom: 20px;
     border-bottom: 2px solid #f0eaff;
     padding-bottom: 10px;
     text-align: center;
   }

   .cancel-container {
     text-align: center;
     margin-bottom: 20px;
   }

   .cancel-link {
     display: inline-block;
     color: #7c4dff;
     text-decoration: none;
     font-weight: 600;
     transition: color 0.2s;
   }

   .cancel-link:hover {
     color: #4a1cce;
     text-decoration: underline;
   }

   .campo-formulario {
     margin-bottom: 18px;
   }

   label {
     display: flex;
     flex-direction: column;
     gap: 8px;
     font-weight: 600;
     color: var(--text-color);
   }

   input {
     padding: 12px;
     border: 2px solid #ebdfff;
     border-radius: 8px;
     font-size: 1rem;
     outline: none;
     transition: border-color 0.2s, box-shadow 0.2s;
   }

   input:focus {
     border-color: #b47cff;
     box-shadow: 0 0 0 3px rgba(180, 124, 255, 0.2);
   }

   .nota-obligatorio {
     color: var(--text-light);
     font-size: 0.85rem;
     margin: 15px 0;
   }

   button[type="submit"] {
     width: 100%;
     background-color: #ffffff;
     color: #000000;
     border: 2px solid #ebdfff;
     padding: 12px;
     border-radius: 8px;
     font-size: 1rem;
     font-weight: 600;
     cursor: pointer;
     transition: background-color 0.3s, border-color 0.3s, transform 0.1s;
   }

   button[type="submit"]:hover {
     background-color: var(--hover-pink);
     border-color: var(--hover-pink);
   }

   button[type="submit"]:active {
     transform: scale(0.99);
   }
 </style>

</head>

<body>

 <form id="formulario">

  <h1>Agregar Usuario</h1>

  <div class="cancel-container">
    <p><a href="index.html" class="cancel-link">← Cancelar</a></p>
  </div>

  <div class="campo-formulario">
   <label>
    Nombre *
    <input name="nombre" required placeholder="Escribe el primer nombre aquí...">
   </label>
  </div>

  <div class="campo-formulario">
   <label>
    Apellido *
    <input name="apellido" required placeholder="Escribe el primer apellido aquí...">
   </label>
  </div>

  <div class="campo-formulario">
   <label>
    Número de celular *
    <input name="celular" type="tel" required placeholder="Escribe el número de celular...">
   </label>
  </div>

  <p class="nota-obligatorio">* Obligatorio</p>

  <p><button type="submit">Agregar</button></p>

 </form>

 <script type="module">
  import { configuraSubmitAccion } from "./libclienteweb/configuraSubmitAccion.js"

  
  configuraSubmitAccion("api/pasatiempo-agrega.php", formulario, "index.html")
 </script>

</body>

</html>
